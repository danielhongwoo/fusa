# 책의 예제다. 실제 제품에 쓸 수 없다.
# safety goal SG-01에서 software safety requirement까지의 요구사항.
# 등급과 수치는 설명을 위한 가정이다. 규격의 요구사항을 만족하는지 확인한 것이 아니다.
#
# 형식은 tools/trace.py의 머리말에 있다.
#   parents      위 단계의 요구사항
#   alloc        요구사항을 받는 요소
#   verified_by  이 요구사항을 보는 test case (test/의 코드에 같은 ID가 있다)
#   proved_by    이 요구사항에 관한 성질을 증명하는 함수 (test/proof/harness.c)
#   status       planned이면 구현 예정이다. 요구사항만 있고 코드와 test가 없다.
#                구현하면 이 줄을 지우고 verified_by를 적는다. 추적 검사가 구현 예정의 수를 늘 찍는다.
#                구현 예정인 요구사항의 숫자 (횟수, 판정값, 상한)는 임시다. 코드와 plant로 잰 뒤에 굳힌다.
#
# 알려진 한계
#   - 페달 검사의 간헐 고장은 실패가 100주기에 10번을 넘을 때만 판정한다 (SWR-14).
#     출력 단계의 깎기가 가끔 일어나는 경우는 판정하지 않는다 (SWR-08).
#   - 페달 고장과 기능의 고장은 다시 켤 때까지 유지한다. 뼈대의 단순화다.
#   - 감시 자신의 고장, 브레이크와 기어의 입력, 메시지의 보호, reset 뒤의 고장 상태에 대한 요구사항은
#     구현 예정이다 (FSR-06 - FSR-13).
#   - SG-02 (구동력의 상실과 감속)의 원인은 SG-01만큼 분석하지 않았다. 그 아래의 요구사항 (FSR-06, FSR-07,
#     FSR-13 - FSR-16)은 분석이 찾은 데까지다. 기능이 토크를 덜 내는 결함을 막는 요구사항은 없다 (docs/hara.md).
#   - 기어의 값이 틀린 경우 (N이나 P인데 D로 읽는다)를 막는 요구사항은 없다. 단계 2에서도 닫지 않는다.
requirements:
  - id: SG-01
    asil: "D (가정)"
    text: "운전자의 요구보다 1.0 m/s^2 넘게 큰 가속이 200 ms 넘게 이어지지 않게 한다. 두 값은 가정이다. 운전자의 요구보다 큰 가속은 고장이 없을 때 같은 입력에서 나오는 가속과의 차이로 잰다. 시간은 이어진 것만이 아니라 어느 1초 안에서 넘은 시간의 합으로도 센다. 끊겼다 이어지기를 되풀이하는 고장을 덮으려는 것이다."
    parents: []
  - id: SG-02
    asil: "D (가정)"
    text: "운전자가 요구하지 않은 감속이 1.0 m/s^2를 넘는 상태가 200 ms 넘게 이어지지 않게 하고, 운전자가 요구한 구동력을 경고 없이 잃지 않게 하고, 구동력이 줄거나 끊길 때 그 변화로 차의 안정이 흔들리지 않게 한다. 값은 가정이다. 운전자가 요구하지 않은 감속은 가속 페달을 놓고 타력으로 갈 때의 감속과의 차이로 잰다. 시간은 SG-01과 같은 방법으로 센다. hazard H-04 (구동력의 감소나 상실)에서 나왔다."
    parents: []

  - id: FSR-01
    text: "VCU는 가속 페달 위치를 서로 독립된 두 신호로 읽고, 두 신호가 범위를 벗어나거나 서로 맞지 않으면 알아챈다."
    parents: [SG-01]
  - id: FSR-02
    text: "VCU는 운전자의 입력 (가속 페달, 브레이크, 기어)에서 허용 토크를 구하고, inverter로 보내는 토크 요구가 허용 토크를 넘지 않게 한다."
    parents: [SG-01]
  - id: FSR-03
    text: "가속 페달 위치를 믿을 수 없으면 VCU는 토크 요구를 바로 0으로 하고 운전자에게 경고를 요청한다. 다시 켤 때까지 유지한다."
    parents: [SG-01]
  - id: FSR-04
    text: "토크 요구가 허용 토크를 계속 넘으면 VCU는 기능의 고장으로 보고, 토크 요구를 0으로 하고 구동 허용 신호를 끊고 운전자에게 경고를 요청한다. 다시 켤 때까지 유지한다."
    parents: [SG-01]
  - id: FSR-05
    text: "가속 페달을 놓았거나, 브레이크를 밟았거나, 기어가 P 또는 N이면 VCU는 구동 토크를 요구하지 않는다."
    parents: [SG-01]
  - id: FSR-06
    text: "VCU는 브레이크 페달의 상태를 서로 반대로 움직이는 두 접점으로 읽고, 둘이 어긋나면 알아챈다. 어긋나는 동안에는 밟은 것으로 본다. 어긋남이 이어지면 토크 요구를 0으로 하고 운전자에게 경고를 요청한다."
    parents: [SG-01, SG-02]
    status: planned
  - id: FSR-07
    text: "VCU는 구동 토크의 방향이 바뀌는 것 (D와 R 사이의 바뀜)을 차량 속도가 유효하고 정해진 값 아래일 때만 받아들인다. 받아들이지 못한 동안에는 구동 토크를 요구하지 않고, 그 상태가 이어지면 운전자에게 알린다."
    parents: [SG-02]
    status: planned
  - id: FSR-08
    text: "VCU와 inverter, 제동 제어기 사이에 오가는 값이 전송 중에 바뀌거나, 되풀이되거나, 끊기면 받는 쪽이 알아챌 수 있게 한다. VCU는 그런 값을 쓰지 않는다."
    parents: [SG-01]
    status: planned
  - id: FSR-09
    text: "inverter가 낸 토크가 VCU가 요구한 토크의 범위를 계속 벗어나거나 inverter의 상태를 계속 알 수 없으면 VCU는 구동 허용 신호를 끊고 운전자에게 경고를 요청한다."
    parents: [SG-01]
    status: planned
  - id: FSR-10
    text: "입력 검사, 감시, 출력 단계가 정해진 순서와 주기로 실행되지 않으면, VCU의 소프트웨어와 따로 동작하는 요소가 구동을 막을 수 있게 한다."
    parents: [SG-01]
    status: planned
  - id: FSR-11
    text: "VCU는 구동 허용 신호가 쓴 대로 나가는지를 확인하고, 그렇지 않으면 구동을 허용하지 않고 운전자에게 경고를 요청한다."
    parents: [SG-01]
    status: planned
  - id: FSR-12
    text: "고장 상태는 reset이나 memory의 값이 바뀌는 것으로 풀리지 않는다. 기록된 고장 상태는 정비에서 지울 때까지 남는다."
    parents: [SG-01]
    status: planned
  - id: FSR-13
    text: "고장 대응의 상태는 한 곳에서 정한다. 상태는 안전한 쪽으로만 바뀌고, 다시 켤 때까지 돌아가지 않는다."
    parents: [SG-01, SG-02]
  - id: FSR-14
    text: "고장이 없으면 감시와 출력 단계는 기능의 토크 요구를 깎지 않는다."
    parents: [SG-02]
  - id: FSR-15
    text: "한두 주기의 입력 이상 (잡음, 접점의 튐)으로는 고장으로 판정하지 않는다. 그 주기의 토크는 안전한 쪽으로 두지만, 이상이 사라지면 토크가 돌아온다."
    parents: [SG-02]
  - id: FSR-16
    text: "가속 페달 채널 하나가 전압 범위를 벗어나고 다른 채널이 범위 안이면 VCU는 토크를 끊지 않고 제한된 토크로 계속 가며 운전자에게 주의를 요청한다. 제한은 남은 채널이 틀려도 SG-01을 어기지 않는 크기다. 두 채널이 범위 안에서 어긋나는 고장과 간헐 고장은 어느 채널이 틀렸는지 알 수 없으므로 토크 0으로 간다."
    parents: [SG-01, SG-02]
    status: planned

  - id: TSR-01
    text: "두 채널의 전압을 페달 위치 (0-1000)로 바꾼다. 채널마다 전압의 범위를 검사하고, 두 채널의 차이가 50을 넘는지 검사한다."
    parents: [FSR-01]
  - id: TSR-02
    text: "검사에 실패한 주기가 3번 이어지면 페달 고장으로 판정하고, 그 주기의 출력부터 반영한다. 한 주기라도 통과하면 다시 센다. 고장이 난 때부터 반영까지 가장 나쁜 경우 30 ms다."
    parents: [FSR-01, FSR-03, FSR-15]
  - id: TSR-03
    text: "허용 토크는 둘 가운데 작은 값이다: 안전한 페달 값에 비례하는 상한 (최대 토크 x 페달 / 1000, 후진은 그 40%, 여기에 오차 5 Nm를 더하고 최대 토크에서 자른다)과, 지난 주기에 보낸 토크의 크기에 25 Nm를 더한 값. FSR-05의 조건에서는 0이다. 허용 토크와 정상인 기능의 토크 요구는 두 방향으로 맞물려야 한다: 기능의 토크 요구는 허용 토크를 넘지 않고, 둘의 차이는 SG-01의 가속 한계에 해당하는 토크 (55 Nm)보다 작다. 입력이 바뀌어 기능이 토크를 올리는 동안에도 그렇다."
    parents: [FSR-02, FSR-05]
  - id: TSR-04
    text: "출력 단계는 10 ms마다 토크 요구를 허용 토크와 기어가 정한 방향 안으로 깎아서 보낸다."
    parents: [FSR-02]
  - id: TSR-05
    text: "깎인 주기가 5번 이어지면 기능의 고장으로 고정한다. 그 주기에 토크 0을 보내고 구동 허용 신호를 끊는다. 한 주기라도 깎이지 않으면 다시 센다. 고장이 난 때부터 차단까지 가장 나쁜 경우 50 ms다."
    parents: [FSR-04, FSR-15]
  - id: TSR-06
    text: "페달 고장이나 기능의 고장을 판정한 주기에 경고 요청을 보낸다."
    parents: [FSR-03, FSR-04]
  - id: TSR-07
    text: "켠 뒤에는 입력 검사를 3주기 이어서 통과하기 전까지 토크를 허용하지 않는다."
    parents: [FSR-01]
  - id: TSR-08
    text: "최근 100주기 (1초) 가운데 검사에 실패한 주기가 10번을 넘으면 페달 고장으로 판정하고, 그 주기의 출력부터 반영한다. 이어지지 않고 가끔 실패하는 간헐 고장을 잡는다. 두 값은 임시다. 실패가 100주기에 10번 이하인 간헐 고장은 판정하지 않는다."
    parents: [FSR-01, FSR-03, FSR-15]
  - id: TSR-09
    text: "정상인 기능의 토크 요구는 허용 토크를 넘지 않는다. 입력이 어떻게 바뀌어도 그렇다. 기능과 감시가 같은 주기에 같은 입력을 받고 주기마다 순서대로 실행된다는 전제에서다."
    parents: [FSR-14]
  - id: TSR-10
    text: "브레이크의 접점 둘 (밟으면 닫히는 것과 밟으면 열리는 것)을 주기마다 읽는다. 어느 하나라도 밟음을 가리키면 그 주기부터 밟음으로 본다. 놓음은 두 접점이 모두 놓음을 가리키고 3주기 이어진 뒤에 받아들인다. 두 접점이 어긋난 채 20주기 이어지면 브레이크 신호의 고장으로 판정하고, 토크 0의 사건을 알린다. 값은 임시다."
    parents: [FSR-06, FSR-15]
    status: planned
  - id: TSR-11
    text: "운전자가 고른 기어와 받아들인 기어를 나눈다. 마지막으로 받아들인 방향 (D 또는 R)을 기억한다. 켠 직후에는 받아들인 방향이 없다. 받아들인 방향이 없거나 그것과 반대인 방향을 고르면 (N이나 P를 거친 것도 같다) 차량 속도가 유효하고 크기가 5 km/h 아래일 때만 받아들인다. 받아들이지 못한 동안 받아들인 기어는 N이고, 조건이 풀리면 받아들인다. 고장으로 판정하지 않는다. 마지막으로 받아들인 방향과 같은 방향을 고르면 속도를 보지 않는다. 방향의 바뀜을 고르지 않은 동안에는 속도가 무효여도 받아들인 기어가 그대로다. 받아들이지 못한 채 50주기 이어지면 주의를 요청하고, 조건이 풀리면 거둔다. 기능과 감시는 받아들인 기어를 쓴다. 값은 임시다."
    parents: [FSR-07]
    status: planned
  - id: TSR-12
    text: "토크 요구 메시지에 counter, CRC, data ID를 붙인다. 싣는 값은 출력 단계가 깎은 뒤의 토크다. 받는 메시지 (차량 속도, inverter의 상태)는 counter, CRC, data ID, 받은 뒤로 흐른 시간을 검사한다. 틀리거나 시간이 넘으면 값을 무효로 하고, 무효인 동안 마지막 값을 쓰지 않는다."
    parents: [FSR-08]
    status: planned
  - id: TSR-13
    text: "inverter가 알린 토크를 VCU가 보낸 토크의 최근 50 ms와 견준다. 최근 5주기에 보낸 토크와 0 가운데 가장 큰 값보다 30 Nm 넘게 크거나, 가장 작은 값보다 30 Nm 넘게 작은 주기가 3번 이어지면 구동 허용 차단의 사건을 알린다. 보낸 토크와 0 사이의 값은 벗어난 것이 아니다 (inverter가 덜 내는 것은 이 검사의 대상이 아니다). inverter의 상태가 무효인 주기가 10번 이어져도 같은 사건을 알린다. 값은 임시다."
    parents: [FSR-09]
    status: planned
  - id: TSR-14
    text: "task마다 실행한 표시를 남긴다. 주기의 끝에서 순서와 횟수를 확인하고, 맞으면 그 주기의 계산 결과에서 만든 답을 외부 watchdog에 보낸다. 틀리면 답을 보내지 않는다."
    parents: [FSR-10]
    status: planned
  - id: TSR-15
    text: "구동 허용 신호를 쓴 뒤 그 선을 되읽어 쓴 값과 견준다. 켤 때에는 끊긴 것을 되읽어 확인한 뒤에 허용한다. 어긋나면 구동 허용 차단으로 가고 경고를 요청한다."
    parents: [FSR-11]
    status: planned
  - id: TSR-16
    text: "고장 대응의 상태와 받아들인 기어는 값과 뒤집은 사본을 함께 두고, 읽을 때마다 견준다. 어긋나면 구동 허용 차단으로 간다."
    parents: [FSR-12]
    status: planned
  - id: TSR-17
    text: "고장 대응의 상태가 토크 0이나 구동 허용 차단이 되면, 구동 허용 신호를 끊거나 토크 0을 보낸 뒤에 그 상태를 비휘발성 memory에 한 번 적는다 (사본 둘과 CRC). 쓰기는 주기의 실행을 막지 않는다. 켤 때 기록을 읽은 뒤에야 TSR-07의 대기가 끝난다. 기록에 고장이 있거나 두 사본을 모두 읽을 수 없으면 그 상태 (읽을 수 없으면 구동 허용 차단)에서 시작한다. reset의 원인이 외부 watchdog이면 구동 허용 차단에서 시작한다. 이 차단은 그 운행에만 적용하고 기록하지 않는다. 기록은 정비의 명령으로만 지운다."
    parents: [FSR-12]
    status: planned
  - id: TSR-18
    text: "검사 실패가 3주기 이어진 주기에 (TSR-02의 판정) 그 세 주기가 모두 같은 채널 하나의 전압 범위 실패였고 다른 채널이 범위 안이었으면, 페달 고장 대신 줄여 감의 사건을 알린다. 줄여 감 상태에서는 범위를 벗어난 채널을 검사에서 빼고, 남은 채널의 전압 범위만 검사한다. TSR-02와 TSR-08이 세는 실패도 남은 채널의 범위 실패뿐이다. 남은 채널의 범위 검사가 3주기 이어서 실패하면 토크 0의 사건을 알린다. 안전한 페달 값은 남은 채널에서 구한다. 감시의 허용 토크에 40 Nm의 상한을 건다 (허용 오차를 더한 뒤의 값). 기능은 35 Nm를 넘게 요구하지 않는다. 기능은 상태가 바뀐 그 주기에 상태를 받는다. 다시 켤 때까지 정상으로 돌아가지 않는다. 두 채널이 범위 안에서 어긋나면 토크 0으로 간다. 값은 임시다. 상한은 남은 채널이 틀렸을 때 넘는 토크 (40 Nm)와 inverter의 오차 (10 Nm)의 합이 SG-01의 55 Nm보다 작도록 정했다."
    parents: [FSR-16]
    status: planned
  - id: TSR-19
    text: "고장 대응의 상태는 넷이다: 정상, 줄여 감, 토크 0, 구동 허용 차단. 안전한 쪽으로만 바뀌고, 단계를 건너뛸 수 있다. 입력 검사, 감시, 출력 단계는 사건을 알릴 뿐 구동 허용 신호와 경고 요청을 직접 바꾸지 않는다. 토크의 상한 (줄여 감에서 40 Nm, 토크 0과 구동 허용 차단에서 0), 구동 허용 신호, 고장에 대한 경고 요청 (줄여 감에서 주의, 토크 0과 구동 허용 차단에서 경고)은 상태에서 나온다."
    parents: [FSR-13]

  - id: SWR-01
    alloc: "입력 검사"
    text: "두 채널의 전압을 페달 위치 (0-1000)로 바꾼다. 빼거나 곱하기 전에 범위를 본다."
    parents: [TSR-01]
    verified_by: [TC-001]
    proved_by: [prove_pedal_check]
  - id: SWR-02
    alloc: "입력 검사"
    text: "채널 1의 전압이 250-4750 mV, 채널 2의 전압이 125-2375 mV를 벗어나거나, 두 채널의 페달 위치의 차이가 50을 넘으면 그 주기의 검사는 실패다."
    parents: [TSR-01]
    verified_by: [TC-002, TC-102, TC-103]
  - id: SWR-03
    alloc: "입력 검사"
    text: "검사에 실패한 주기가 3번 이어지면 페달 고장으로 고정한다. 한 주기라도 통과하면 다시 센다."
    parents: [TSR-02]
    verified_by: [TC-003, TC-102]
    proved_by: [prove_pedal_check]
  - id: SWR-04
    alloc: "입력 검사"
    text: "안전한 페달 값은 두 채널 가운데 작은 값이다. 페달 고장이거나, 켠 뒤 검사를 3주기 이어서 통과하기 전이면 0이다."
    parents: [TSR-02, TSR-07]
    verified_by: [TC-004, TC-102, TC-105]
    proved_by: [prove_pedal_check]
  - id: SWR-05
    alloc: "감시"
    text: "안전한 페달 값이 30 아래이거나, 브레이크를 밟았거나, 기어가 D와 R이 아니면 허용 토크는 0이다."
    parents: [TSR-03]
    verified_by: [TC-005, TC-104, TC-107, TC-202, TC-206]
    proved_by: [prove_allowed_torque]
  - id: SWR-06
    alloc: "감시"
    text: "그 밖에는 페달에서 나온 상한 = 최대 토크 x 안전한 페달 값 / 1000 + 5 Nm이고, 최대 토크를 넘지 않는다. 후진에서는 곱의 40%에 5 Nm를 더한다. 정상인 기능의 토크 요구는 이 값을 넘지 않는다. 입력이 그대로인 동안 이 값과의 차이는 55 Nm보다 작다."
    parents: [TSR-03, TSR-09]
    verified_by: [TC-006, TC-007, TC-204]
    proved_by: [prove_allowed_torque, prove_normal_function_not_clamped]
  - id: SWR-07
    alloc: "출력 단계"
    text: "보내는 토크는 D에서는 0 이상 허용 토크 이하, R에서는 허용 토크의 음수 이상 0 이하다. 그 밖의 기어에서는 0이다. 범위 안의 토크 요구는 그대로 보낸다."
    parents: [TSR-04]
    verified_by: [TC-008, TC-106, TC-201, TC-203, TC-204]
    proved_by: [prove_output_clamp, prove_output_stage]
  - id: SWR-08
    alloc: "출력 단계"
    text: "토크 요구를 깎은 주기가 5번 이어지면 기능의 고장으로 고정한다. 한 주기라도 깎지 않으면 다시 센다."
    parents: [TSR-05]
    verified_by: [TC-009, TC-201, TC-202, TC-204]
    proved_by: [prove_output_stage]
  - id: SWR-09
    alloc: "출력 단계"
    text: "고정한 주기부터 토크 0을 보낸다. 고정은 다시 켤 때까지 풀리지 않는다."
    parents: [TSR-05]
    verified_by: [TC-010, TC-201]
    proved_by: [prove_output_stage]
  - id: SWR-10
    alloc: "출력 단계"
    text: "고정한 주기부터 구동 허용 신호를 끊는다. 고정하지 않았으면 끊지 않는다."
    parents: [TSR-05]
    verified_by: [TC-101, TC-201]
  - id: SWR-11
    alloc: "출력 단계"
    text: "페달 고장이나 기능의 고장이면 경고를 요청한다. 고장이 없으면 요청하지 않는다."
    parents: [TSR-06]
    verified_by: [TC-101, TC-102, TC-201]
  - id: SWR-12
    alloc: "출력 단계"
    text: "켤 때 구동 허용 신호를 끊은 상태에서 시작하고, 입력 검사를 3주기 이어서 통과한 뒤에 허용한다."
    parents: [TSR-07]
    verified_by: [TC-108]
  - id: SWR-13
    alloc: "감시"
    text: "허용 토크는 페달에서 나온 상한 (SWR-05, SWR-06)과, 지난 주기에 보낸 토크의 크기에 25 Nm를 더한 값 가운데 작은 쪽이다. 지난 주기에 보낸 토크의 방향이 지금 기어의 방향과 다르거나 기어가 P, N이면 0에서 센다. 내려가는 쪽은 제한하지 않는다. 정상인 기능의 토크 요구는 이 값을 넘지 않는다. 입력이 바뀌는 동안에도 이 값과의 차이는 5 Nm를 넘지 않는다."
    parents: [TSR-03, TSR-09]
    verified_by: [TC-007, TC-011, TC-012, TC-013, TC-205]
    proved_by: [prove_limit_rise, prove_normal_function_not_clamped]
  - id: SWR-14
    alloc: "입력 검사"
    text: "주기마다 검사의 결과를 기록하고, 최근 100주기의 기록 가운데 실패가 10번을 넘으면 페달 고장으로 고정한다. 켠 직후의 대기 중에도 센다. 기록의 자리가 범위를 벗어나 있으면 처음으로 돌린다."
    parents: [TSR-08]
    verified_by: [TC-014, TC-109]
    proved_by: [prove_pedal_check]
  - id: SWR-15
    alloc: "입력 검사"
    text: "브레이크의 두 접점에서 밟음 여부를 정한다. 어느 하나라도 밟음이면 밟음이다. 놓음은 두 접점이 모두 놓음이고 3주기 이어진 뒤다. 어긋난 채 20주기 이어지면 토크 0의 사건을 알리고 밟음으로 둔다. 정한 값 하나를 기능과 감시에 같이 준다."
    parents: [TSR-10]
    status: planned
  - id: SWR-16
    alloc: "입력 검사"
    text: "받아들인 기어를 정한다. 마지막으로 받아들인 방향 (D 또는 R)을 기억한다. 켠 직후에는 없음이다. 받아들인 방향이 없거나 그것과 반대인 방향은 차량 속도가 유효하고 크기가 5 km/h 아래일 때만 받아들인다. 그렇지 않은 동안에는 N을 낸다. 방향이 같으면 속도를 보지 않는다. 받아들이지 못한 채 50주기 이어지면 주의를 요청한다. 정한 값 하나를 기능과 감시에 같이 준다."
    parents: [TSR-11]
    status: planned
  - id: SWR-17
    alloc: "통신"
    text: "토크 요구 메시지를 만들 때 counter를 1 올리고, data ID와 함께 CRC를 계산해 붙인다. 싣는 토크는 출력 단계가 돌려준 값이다."
    parents: [TSR-12]
    status: planned
  - id: SWR-18
    alloc: "통신"
    text: "받은 메시지의 CRC와 data ID가 맞는지, counter가 지난 것보다 앞섰는지, 받은 뒤로 흐른 시간이 한계 안인지 검사한다. counter가 지난 것과 같으면 (되풀이) 무효이고, 둘보다 많이 건너뛰었어도 무효다. 하나라도 틀리면 값이 무효라고 알리고 마지막 값을 돌려주지 않는다. 값은 임시다."
    parents: [TSR-12]
    status: planned
  - id: SWR-19
    alloc: "감시"
    text: "inverter가 알린 토크가 범위 [최근 5주기에 보낸 토크와 0 가운데 가장 작은 값 - 30 Nm, 가장 큰 값 + 30 Nm]를 벗어난 주기가 3번 이어지면 구동 허용 차단의 사건을 알린다. inverter의 상태가 무효인 주기가 10번 이어져도 같다."
    parents: [TSR-13]
    status: planned
  - id: SWR-20
    alloc: "주기 실행"
    text: "task마다 정해진 표시를 남기고, 주기의 끝에서 표시의 순서와 수가 task table과 같은지 확인한다. 같으면 그 주기의 허용 토크와 보낸 토크에서 만든 답을 외부 watchdog에 쓴다. 다르면 쓰지 않는다."
    parents: [TSR-14]
    status: planned
  - id: SWR-21
    alloc: "출력 단계"
    text: "구동 허용 신호를 쓴 다음 주기에 되읽은 값이 쓴 값과 다르면 구동 허용 차단의 사건을 알린다. 켤 때에는 끊긴 것을 되읽어 확인하기 전까지 허용하지 않는다."
    parents: [TSR-15]
    status: planned
  - id: SWR-22
    alloc: "상태 기계"
    text: "고장 대응의 상태와 받아들인 기어는 접근 함수로만 읽고 쓴다. 쓸 때 뒤집은 사본을 함께 쓰고, 읽을 때 견준다. 어긋나면 구동 허용 차단을 돌려준다."
    parents: [TSR-16]
    status: planned
  - id: SWR-23
    alloc: "상태 기계"
    text: "상태가 토크 0이나 구동 허용 차단으로 바뀐 주기의 출력을 낸 뒤에 그 상태를 비휘발성 memory의 두 자리에 CRC와 함께 적는다. 켤 때 두 자리를 읽어, 고장이 적혀 있으면 그 상태에서, 둘 다 읽을 수 없거나 reset의 원인이 외부 watchdog이면 구동 허용 차단에서 시작한다. reset의 원인 때문에 들어간 차단은 적지 않는다. 기록을 지우는 것은 정비의 명령뿐이다."
    parents: [TSR-17]
    status: planned
  - id: SWR-24
    alloc: "입력 검사, 감시"
    text: "검사 실패가 3주기 이어진 주기에, 그 세 주기가 모두 같은 채널 하나의 범위 실패였고 다른 채널이 범위 안이었으면 입력 검사는 페달 고장 대신 줄여 감의 사건을 알리고 범위 안의 채널에서 안전한 페달 값을 낸다. 그 뒤로는 남은 채널의 범위만 검사하고 (SWR-03과 SWR-14가 세는 실패도 그것뿐이다), 3주기 이어서 실패하면 토크 0의 사건을 알린다. 줄여 감 상태에서 감시의 허용 토크는 40 Nm를 넘지 않는다."
    parents: [TSR-18]
    status: planned
  - id: SWR-25
    alloc: "상태 기계"
    text: "사건을 받아 상태를 정한다. 상태는 정상, 줄여 감, 토크 0, 구동 허용 차단 가운데 하나이고, 안전한 쪽으로만 바뀐다 (단계를 건너뛸 수 있다). 상태에서 토크의 상한, 구동 허용 신호, 경고 요청을 정한다. 상태를 담은 변수가 알 수 없는 값이면 구동 허용 차단으로 본다."
    parents: [TSR-19]
    verified_by: [TC-015, TC-102, TC-201]
    proved_by: [prove_reaction, prove_output_stage]
