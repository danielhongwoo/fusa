<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" font-family="Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="13">
  <title>책 지도: safety lifecycle 위에 놓은 장</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="676" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">책 지도: safety lifecycle 위에 놓은 장</text>

  <!-- Part I -->
  <rect x="30" y="48" width="940" height="40" rx="4" fill="#e5e7eb" stroke="#555555"/>
  <text x="500" y="73" text-anchor="middle" fill="#111111">Part I (1-4장). 사례, 용어, risk와 integrity level, 규격 지도</text>

  <!-- 5장 -->
  <rect x="30" y="98" width="940" height="40" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="500" y="123" text-anchor="middle" fill="#111111">5장. Safety lifecycle과 safety management (전체에 걸친 관리)</text>

  <!-- V의 왼쪽: 요구를 아래로 내린다 -->
  <rect x="30" y="160" width="260" height="42" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="160" y="187" text-anchor="middle" fill="#111111">6장. HARA와 safety goal</text>
  <rect x="70" y="218" width="260" height="42" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="200" y="245" text-anchor="middle" fill="#111111">7장. Safety concept</text>
  <rect x="110" y="276" width="260" height="42" rx="4" fill="#dcfce7" stroke="#555555"/>
  <text x="240" y="303" text-anchor="middle" fill="#111111">10장. Software safety requirements</text>
  <rect x="150" y="334" width="260" height="42" rx="4" fill="#dcfce7" stroke="#555555"/>
  <text x="280" y="361" text-anchor="middle" fill="#111111">11장. Software architecture</text>
  <rect x="190" y="392" width="260" height="42" rx="4" fill="#dcfce7" stroke="#555555"/>
  <text x="320" y="419" text-anchor="middle" fill="#111111">12, 13장. Safety mechanism과 코딩</text>

  <!-- V의 오른쪽: 아래에서 위로 검증한다 -->
  <rect x="710" y="160" width="260" height="42" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="840" y="187" text-anchor="middle" fill="#111111">19장. Safety case와 assessment</text>
  <rect x="670" y="218" width="260" height="42" rx="4" fill="#ffffff" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="800" y="245" text-anchor="middle" fill="#444444">시스템 통합과 test (개요만 다룸)</text>
  <rect x="630" y="276" width="260" height="42" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="760" y="303" text-anchor="middle" fill="#111111">16장. Embedded software test</text>
  <rect x="590" y="334" width="260" height="42" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="720" y="361" text-anchor="middle" fill="#111111">16장. Software integration test</text>
  <rect x="550" y="392" width="260" height="42" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="680" y="419" text-anchor="middle" fill="#111111">15, 16장. Unit verification</text>

  <!-- 왼쪽: 아래로 내려가는 흐름 -->
  <line x1="180" y1="202" x2="180" y2="217" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="260" x2="220" y2="275" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="318" x2="260" y2="333" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="376" x2="300" y2="391" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 맨 아래: 구현에서 검증으로 -->
  <line x1="450" y1="413" x2="549" y2="413" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 오른쪽: 위로 올라가는 흐름 -->
  <line x1="700" y1="392" x2="700" y2="377" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="334" x2="740" y2="319" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="276" x2="780" y2="261" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="218" x2="820" y2="203" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 같은 높이의 짝: 오른쪽 활동이 왼쪽 산출물을 검증한다 -->
  <line x1="710" y1="181" x2="291" y2="181" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="500" y="174" text-anchor="middle" font-size="11" fill="#555555">safety goal을 달성했는가</text>
  <line x1="670" y1="239" x2="331" y2="239" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="500" y="232" text-anchor="middle" font-size="11" fill="#555555">safety concept대로 동작하는가</text>
  <line x1="630" y1="297" x2="371" y2="297" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="500" y="290" text-anchor="middle" font-size="11" fill="#555555">요구사항을 만족하는가</text>
  <line x1="590" y1="355" x2="411" y2="355" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="500" y="348" text-anchor="middle" font-size="11" fill="#555555">설계대로 통합되었는가</text>

  <!-- V 전체에 입력을 주는 장 -->
  <text x="30" y="462" font-size="12" fill="#555555">V 전체에 입력을 주는 장</text>
  <rect x="30" y="470" width="300" height="40" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="180" y="495" text-anchor="middle" fill="#111111">8장. Safety analysis 기법</text>
  <rect x="350" y="470" width="300" height="40" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="500" y="495" text-anchor="middle" fill="#111111">9장. 알아야 할 하드웨어</text>
  <rect x="670" y="470" width="300" height="40" rx="4" fill="#dcfce7" stroke="#555555"/>
  <text x="820" y="495" text-anchor="middle" fill="#111111">14장. 플랫폼: RTOS, OS, multicore</text>

  <!-- 지원 활동 -->
  <text x="30" y="530" font-size="12" fill="#555555">지원 활동</text>
  <rect x="30" y="538" width="460" height="40" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="260" y="563" text-anchor="middle" fill="#111111">17장. Tool과 기존 소프트웨어</text>
  <rect x="510" y="538" width="460" height="40" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="740" y="563" text-anchor="middle" fill="#111111">18장. 변경, 형상, 릴리스 이후</text>

  <!-- Part V -->
  <rect x="30" y="594" width="940" height="40" rx="4" fill="#f3e8ff" stroke="#555555"/>
  <text x="500" y="619" text-anchor="middle" fill="#111111">Part V (20-24장). 로봇, 드론, 그 밖의 분야, functional safety의 경계, 실무</text>

  <!-- 범례 -->
  <rect x="30" y="648" width="12" height="12" fill="#e5e7eb" stroke="#555555"/>
  <text x="48" y="659" font-size="12" fill="#333333">Part I</text>
  <rect x="110" y="648" width="12" height="12" fill="#dbeafe" stroke="#555555"/>
  <text x="128" y="659" font-size="12" fill="#333333">Part II</text>
  <rect x="190" y="648" width="12" height="12" fill="#dcfce7" stroke="#555555"/>
  <text x="208" y="659" font-size="12" fill="#333333">Part III</text>
  <rect x="270" y="648" width="12" height="12" fill="#ffedd5" stroke="#555555"/>
  <text x="288" y="659" font-size="12" fill="#333333">Part IV</text>
  <rect x="350" y="648" width="12" height="12" fill="#f3e8ff" stroke="#555555"/>
  <text x="368" y="659" font-size="12" fill="#333333">Part V</text>
  <line x1="440" y1="654" x2="480" y2="654" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="488" y="659" font-size="12" fill="#333333">점선: 오른쪽 활동이 왼쪽 산출물을 검증한다</text>
</svg>
