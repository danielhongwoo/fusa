<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14">
  <title>책 지도: safety lifecycle 위에 놓은 장</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="840" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">책 지도: safety lifecycle 위에 놓은 장</text>

  <!-- 전체에 걸친 장 -->
  <rect x="20" y="46" width="860" height="40" rx="4" fill="#e5e7eb" stroke="#555555"/>
  <text x="450" y="71" text-anchor="middle" fill="#111111">Part I (1-4장). 사례, 용어, risk와 integrity level, 규격 지도</text>
  <rect x="20" y="94" width="860" height="40" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="450" y="119" text-anchor="middle" fill="#111111">5장. Safety lifecycle과 safety management (전체에 걸친 관리)</text>
  <rect x="20" y="142" width="860" height="40" rx="4" fill="#ffedd5" stroke="#222222" stroke-width="3"/>
  <text x="450" y="167" text-anchor="middle" fill="#111111">19장. Safety case와 assessment (전체에 걸친 논증과 평가)</text>

  <!-- V의 왼쪽: 요구를 아래로 내린다 -->
  <rect x="20" y="200" width="270" height="44" rx="4" fill="#dbeafe" stroke="#222222" stroke-width="3"/>
  <text x="155" y="227" text-anchor="middle" fill="#111111">6장. HARA와 safety goal</text>
  <rect x="46" y="256" width="270" height="62" rx="4" fill="#dbeafe" stroke="#222222" stroke-width="3"/>
  <text x="181" y="282" text-anchor="middle" fill="#111111">7장. Functional safety concept</text>
  <text x="181" y="304" text-anchor="middle" fill="#111111">Technical safety concept</text>
  <rect x="72" y="330" width="270" height="44" rx="4" fill="#dcfce7" stroke="#222222" stroke-width="3"/>
  <text x="207" y="357" text-anchor="middle" fill="#111111">10장. Software safety requirements</text>
  <rect x="98" y="386" width="270" height="44" rx="4" fill="#dcfce7" stroke="#222222" stroke-width="3"/>
  <text x="233" y="413" text-anchor="middle" fill="#111111">11장. Software architecture</text>
  <rect x="124" y="442" width="270" height="44" rx="4" fill="#dcfce7" stroke="#222222" stroke-width="3"/>
  <text x="259" y="469" text-anchor="middle" fill="#111111">12장. Safety mechanism</text>
  <rect x="150" y="498" width="270" height="44" rx="4" fill="#dcfce7" stroke="#555555"/>
  <text x="285" y="525" text-anchor="middle" fill="#111111">13장. Coding</text>

  <!-- V의 오른쪽: 아래에서 위로 검증한다 -->
  <rect x="610" y="200" width="270" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="745" y="227" text-anchor="middle" fill="#444444">Safety validation (개요만 다룸)</text>
  <rect x="584" y="265" width="270" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="719" y="292" text-anchor="middle" fill="#444444">시스템 통합과 test (개요만 다룸)</text>
  <rect x="558" y="330" width="270" height="44" rx="4" fill="#ffedd5" stroke="#222222" stroke-width="3"/>
  <text x="693" y="357" text-anchor="middle" fill="#111111">16장. Embedded software test</text>
  <rect x="532" y="386" width="270" height="44" rx="4" fill="#ffedd5" stroke="#222222" stroke-width="3"/>
  <text x="667" y="413" text-anchor="middle" fill="#111111">16장. Software integration test</text>
  <rect x="506" y="442" width="270" height="44" rx="4" fill="#ffedd5" stroke="#222222" stroke-width="3"/>
  <text x="641" y="469" text-anchor="middle" fill="#111111">16장. Unit test</text>
  <rect x="480" y="498" width="270" height="44" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="615" y="525" text-anchor="middle" fill="#111111">15장. 정적 분석과 formal verification</text>

  <!-- 왼쪽: 아래로 내려가는 흐름 -->
  <line x1="170" y1="245" x2="170" y2="254" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="196" y1="319" x2="196" y2="328" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="222" y1="375" x2="222" y2="384" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="431" x2="248" y2="440" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="274" y1="487" x2="274" y2="496" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 맨 아래: 구현에서 검증으로 -->
  <line x1="420" y1="520" x2="478" y2="520" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 오른쪽: 위로 올라가는 흐름 -->
  <line x1="626" y1="497" x2="626" y2="488" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="652" y1="441" x2="652" y2="432" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="678" y1="385" x2="678" y2="376" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="704" y1="329" x2="704" y2="311" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="264" x2="730" y2="246" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 같은 높이의 짝: 오른쪽 활동이 왼쪽 산출물을 검증한다 -->
  <line x1="609" y1="222" x2="293" y2="222" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="450" y="215" text-anchor="middle" font-size="12" fill="#555555">safety goal을 달성했는가</text>
  <line x1="583" y1="287" x2="319" y2="287" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#555555">safety concept대로 동작하는가</text>
  <line x1="557" y1="352" x2="345" y2="352" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#555555">요구사항을 만족하는가</text>
  <line x1="531" y1="408" x2="371" y2="408" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>
  <text x="450" y="401" text-anchor="middle" font-size="12" fill="#555555">설계대로 통합되었는가</text>
  <line x1="505" y1="464" x2="397" y2="464" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-light)"/>

  <!-- 분석 -->
  <text x="20" y="574" font-size="13" fill="#555555">분석</text>
  <rect x="20" y="582" width="270" height="40" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="155" y="607" text-anchor="middle" fill="#111111">8장. Safety analysis 기법</text>

  <!-- 내 코드 아래 층 -->
  <text x="310" y="574" font-size="13" fill="#555555">내 코드 아래 층</text>
  <rect x="310" y="582" width="180" height="40" rx="4" fill="#dbeafe" stroke="#555555"/>
  <text x="400" y="607" text-anchor="middle" fill="#111111">9장. 하드웨어</text>
  <rect x="500" y="582" width="180" height="40" rx="4" fill="#dcfce7" stroke="#555555"/>
  <text x="590" y="607" text-anchor="middle" fill="#111111">14장. 플랫폼</text>
  <rect x="690" y="582" width="190" height="40" rx="4" fill="#f3f4f6" stroke="#222222" stroke-width="3"/>
  <text x="785" y="607" text-anchor="middle" fill="#111111">부록 E. 임베디드 기초</text>

  <!-- 지원 활동 -->
  <text x="20" y="646" font-size="13" fill="#555555">지원 활동</text>
  <rect x="20" y="654" width="425" height="40" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="232" y="679" text-anchor="middle" fill="#111111">17장. Tool과 기존 소프트웨어</text>
  <rect x="455" y="654" width="425" height="40" rx="4" fill="#ffedd5" stroke="#555555"/>
  <text x="667" y="679" text-anchor="middle" fill="#111111">18장. 변경, 형상, 릴리스 이후</text>

  <!-- Part V -->
  <rect x="20" y="708" width="860" height="40" rx="4" fill="#f3e8ff" stroke="#555555"/>
  <text x="450" y="733" text-anchor="middle" fill="#111111">Part V (20-24장). 로봇, 드론, 그 밖의 분야, 경계, 실무</text>

  <!-- 주석과 범례 -->
  <text x="20" y="772" font-size="12" fill="#555555">하드웨어 개발은 소프트웨어 개발과 나란히 진행된다. 이 책은 그 가운데 소프트웨어가 알아야 할 것만 다룬다 (9장).</text>

  <rect x="20" y="786" width="12" height="12" fill="#e5e7eb" stroke="#555555"/>
  <text x="38" y="797" font-size="12" fill="#333333">Part I</text>
  <rect x="90" y="786" width="12" height="12" fill="#dbeafe" stroke="#555555"/>
  <text x="108" y="797" font-size="12" fill="#333333">Part II</text>
  <rect x="164" y="786" width="12" height="12" fill="#dcfce7" stroke="#555555"/>
  <text x="182" y="797" font-size="12" fill="#333333">Part III</text>
  <rect x="242" y="786" width="12" height="12" fill="#ffedd5" stroke="#555555"/>
  <text x="260" y="797" font-size="12" fill="#333333">Part IV</text>
  <rect x="320" y="786" width="12" height="12" fill="#f3e8ff" stroke="#555555"/>
  <text x="338" y="797" font-size="12" fill="#333333">Part V</text>
  <rect x="400" y="786" width="20" height="12" fill="#ffffff" stroke="#555555" stroke-dasharray="5 4"/>
  <text x="426" y="797" font-size="12" fill="#333333">이 책에서 개요만 다루는 활동</text>

  <rect x="20" y="810" width="20" height="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="48" y="821" font-size="12" fill="#333333">단계 1에서 쓰는 장 (2, 3장도 단계 1에서 쓴다)</text>
  <line x1="400" y1="816" x2="440" y2="816" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="448" y="821" font-size="12" fill="#333333">오른쪽 활동이 왼쪽 산출물을 검증한다</text>
</svg>
